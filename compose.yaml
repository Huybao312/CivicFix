name: ${CIVICFIX_PROJECT_NAME:-civicfix}
services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: civicfix
      POSTGRES_USER: civicfix
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${CIVICFIX_DB_PORT:-5433}:5432"
    volumes:
      - civicfix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicfix -d civicfix"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${CIVICFIX_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${CIVICFIX_MAIL_UI_PORT:-8025}:8025"
    labels:
      org.springframework.boot.ignore: "true"

volumes:
  civicfix_pgdata:
