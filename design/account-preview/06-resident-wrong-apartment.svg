<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>CivicFix · 06-resident-wrong-apartment.svg</title><rect x="0" y="0" width="390" height="844" rx="0" fill="#F3F6F3" stroke="none" stroke-width="1"/><rect x="0" y="0" width="390" height="844" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="20" y="45" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="20" font-weight="700" fill="#176351" text-anchor="start">CivicFix</text><text x="370" y="44" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="12" font-weight="500" fill="#5C6963" text-anchor="end">Lời mời</text><line x1="0" y1="65" x2="390" y2="65" stroke="#DCE3DC" stroke-width="1"/><text x="20" y="122" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="23" font-weight="600" fill="#1D2A25" text-anchor="start">Thông tin căn hộ sai?</text><text x="20" y="155" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C6963" text-anchor="start">Đừng kích hoạt tài khoản với căn hộ sai.</text><rect x="20" y="197" width="350" height="133" rx="8" fill="#FBF5E8" stroke="none" stroke-width="1"/><text x="34" y="227" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="12" font-weight="500" fill="#815A16" text-anchor="start">Lời mời đang ghi</text><text x="34" y="258" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="15" font-weight="600" fill="#1D2A25" text-anchor="start">Căn 05-08 · Chung cư An Bình</text><text x="34" y="291" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6963" text-anchor="start">Thông tin này cần quản trị viên kiểm tra lại.</text><text x="20" y="381" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="17" font-weight="600" fill="#1D2A25" text-anchor="start">Điều gì sẽ xảy ra?</text><text x="20" y="421" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="13" font-weight="400" fill="#1D2A25" text-anchor="start">1. Chúng tôi tạm dừng kích hoạt.</text><text x="20" y="452" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="13" font-weight="400" fill="#1D2A25" text-anchor="start">2. Quản trị viên xem lại liên kết căn hộ.</text><text x="20" y="483" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="13" font-weight="400" fill="#1D2A25" text-anchor="start">3. Bạn nhận lời mời mới sau khi sửa.</text><rect x="20" y="576" width="350" height="44" rx="7" fill="#1D2A25" stroke="none" stroke-width="1"/><text x="36" y="603" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start">Báo thông tin không đúng</text><text x="20" y="650" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6963" text-anchor="start">Bạn không thể tự sửa số căn hộ trong lời mời.</text></svg>
