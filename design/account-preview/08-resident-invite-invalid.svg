<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>CivicFix · 08-resident-invite-invalid.svg</title><rect x="0" y="0" width="390" height="844" rx="0" fill="#F3F6F3" stroke="none" stroke-width="1"/><rect x="0" y="0" width="390" height="844" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="20" y="45" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="20" font-weight="700" fill="#176351" text-anchor="start">CivicFix</text><text x="370" y="44" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="12" font-weight="500" fill="#5C6963" text-anchor="end">Lời mời</text><line x1="0" y1="65" x2="390" y2="65" stroke="#DCE3DC" stroke-width="1"/><text x="20" y="153" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="22" font-weight="600" fill="#1D2A25" text-anchor="start">Liên kết không còn dùng được</text><text x="20" y="197" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C6963" text-anchor="start">Liên kết có thể đã hết hạn, đã được dùng</text><text x="20" y="218" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C6963" text-anchor="start">hoặc đã bị thu hồi.</text><rect x="20" y="269" width="350" height="112" rx="8" fill="#FBF5E8" stroke="none" stroke-width="1"/><text x="35" y="299" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="14" font-weight="600" fill="#815A16" text-anchor="start">Bạn chưa được cấp quyền từ link này.</text><text x="35" y="330" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6963" text-anchor="start">Đừng chuyển tiếp link cho người khác.</text><text x="20" y="440" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="18" font-weight="600" fill="#1D2A25" text-anchor="start">Cần tiếp tục?</text><text x="20" y="480" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="13" font-weight="400" fill="#1D2A25" text-anchor="start">Liên hệ quản trị