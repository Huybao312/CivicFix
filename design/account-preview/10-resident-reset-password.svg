<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>CivicFix · 10-resident-reset-password.svg</title><rect x="0" y="0" width="390" height="844" rx="0" fill="#F3F6F3" stroke="none" stroke-width="1"/><rect x="0" y="0" width="390" height="844" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="20" y="45" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="20" font-weight="700" fill="#176351" text-anchor="start">CivicFix</text><text x="370" y="44" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="12" font-weight="500" fill="#5C6963" text-anchor="end">Tài khoản</text><line x1="0" y1="65" x2="390" y2="65" stroke="#DCE3DC" stroke-width="1"/><text x="20" y="125" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="23" font-weight="600" fill="#1D2A25" text-anchor="start">Đặt mật khẩu mới</text><text x="20" y="164" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C6963" text-anchor="start">Liên kết này chỉ dùng một lần.</text><text x="20" y="248" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="14" font-weight="600" fill="#1D2A25" text-anchor="start">Mật khẩu mới</text><rect x="20" y="260" width="350" height="50" rx="7" fill="#FFFFFF" stroke="#DCE3DC" stroke-width="1"/><text x="35" y="291" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="14" font-weight="400" fill="#5C6963" text-anchor="start">Nhập mật khẩu mới</text><text x="20" y="337" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6963" text-anchor="start">Dùng ít nhất 15 ký tự. Cho phép cụm từ dài.</text><text x="20" y="404" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="14" font-weight="600" fill="#1D2A25" text-anchor="start">Nhập lại mật khẩu</text><rect x="20" y="416" width="350" height="50" rx="7" fill="#FFFFFF" stroke="#DCE3DC" stroke-width="1"/><text x="35" y="447" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="14" font-weight="400" fill="#5C6963" text-anchor="start">Nhập lại mật khẩu mới</text><rect x="20" y="507" width="350" height="44" rx="7" fill="#1D2A25" stroke="none" stroke-width="1"/><text x="36" y="534" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start">Lưu mật khẩu mới</text><rect x="20" y="597" width="350" height="115" rx="8" fill="#F8FAF8" stroke="#DCE3DC" stroke-width="1"/><text x="35" y="628" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="14" font-weight="600" fill="#1D2A25" text-anchor="start">Sau khi đổi mật khẩu</text><text x="35" y="658" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6963" text-anchor="start">Các phiên đăng nhập cũ sẽ bị thu hồi.</text><text x="35" y="679" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6963" text-anchor="start">Bạn đăng nhập lại bằng mật khẩu mới.</text></svg>
