<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" aria-label="Chi tiết phiếu với bước tiếp theo rõ ràng"><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F7F8F5"/><g font-family="Arial, Helvetica, sans-serif"><g id="Main-navigation"><rect x="0" y="0" width="1440" height="70" rx="0" fill="#FFFFFF"/><line x1="0" y1="69" x2="1440" y2="69" stroke="#D7DDD8" stroke-width="1"/><path d="M44 23h19v24H44z M44 35h19 M54 23v24 M63 23l8 7v17h-8" fill="none" stroke="#1B695B" stroke-width="2"/><text x="84" y="45" font-size="23" font-weight="700" fill="#1E2925" letter-spacing="-0.7">CivicFix</text><text x="286" y="43" font-size="15" font-weight="400" fill="#66716B" >Việc cần làm</text><text x="430" y="43" font-size="15" font-weight="700" fill="#1E2925" >Tất cả phiếu</text><rect x="430" y="67" width="91" height="3" rx="0" fill="#1B695B"/><text x="1050" y="31" font-size="11" font-weight="700" fill="#66716B" letter-spacing="0.7">CHUNG CƯ</text><text x="1050" y="51" font-size="15" font-weight="400" fill="#1E2925" >Minh An</text><line x1="1218" y1="17" x2="1218" y2="53" stroke="#D7DDD8" stroke-width="1"/><text x="1242" y="43" font-size="15" font-weight="400" fill="#1E2925" >Bảo Ngọc · Quản lý</text></g><g id="Ticket-heading"><text x="60" y="112" font-size="14" font-weight="400" fill="#1B695B" >←  Tất cả phiếu  /  CF-1024</text><text x="60" y="164" font-size="30" font-weight="700" fill="#1E2925" >Đèn hành lang tầng 3</text><text x="60" y="193" font-size="15" font-weight="400" fill="#66716B" >CF-1024  ·  Chờ quản lý xem xét  ·  Báo từ web lúc 09:42, 27/10/2026</text><line x1="60" y1="215" x2="1380" y2="215" stroke="#D7DDD8" stroke-width="1"/></g><g id="Next-step"><rect x="60" y="244" width="1320" height="173" rx="3" fill="#EAF0EB"/><text x="84" y="280" font-size="13" font-weight="700" fill="#1B695B" >Bước tiếp theo</text><text x="84" y="313" font-size="21" font-weight="700" fill="#1E2925" >Kiểm tra báo cáo và quyết định tiếp nhận</text><text x="84" y="341" font-size="14" font-weight="400" fill="#66716B" >Nếu thuộc khu vực chung và đủ thông tin, tiếp nhận. Việc giao người xử lý là bước kế tiếp.</text><rect x="84" y="361" width="174" height="40" rx="3" fill="#1E2925"/><text x="108" y="387" font-size="14" font-weight="700" fill="#FFFFFF" >Tiếp nhận báo cáo</text><text x="290" y="387" font-size="14" font-weight="700" fill="#1B695B" >Hỏi bổ sung</text><text x="460" y="387" font-size="14" font-weight="400" fill="#1E2925" >Đánh dấu trùng</text><text x="648" y="387" font-size="14" font-weight="400" fill="#1E2925" >Từ chối</text></g><g id="Report-evidence"><text x="60" y="469" font-size="20" font-weight="700" fill="#1E2925" >Báo cáo sự cố</text><line x1="60" y1="490" x2="888" y2="490" stroke="#D7DDD8" stroke-width="1"/><text x="60" y="527" font-size="13" font-weight="400" fill="#66716B" >Vị trí thiết bị hỏng</text><text x="60" y="554" font-size="16" font-weight="700" fill="#1E2925" >Hành lang trước căn 03, tầng 3</text><line x1="60" y1="576" x2="888" y2="576" stroke="#D7DDD8" stroke-width="1"/><text x="60" y="613" font-size="13" font-weight="400" fill="#66716B" >Mô tả của người báo</text><text x="60" y="641" font-size="16" font-weight="400" fill="#1E2925" >Đèn nhấp nháy từ tối qua. Lối đi khá tối.</text><line x1="60" y1="662" x2="888" y2="662" stroke="#D7DDD8" stroke-width="1"/><text x="60" y="699" font-size="13" font-weight="400" fill="#66716B" >Ảnh hiện trường</text><text x="60" y="729" font-size="14" font-weight="400" fill="#66716B" >Chưa có ảnh. Vị trí và mô tả đã đủ để quản lý kiểm tra ban đầu.</text></g><line x1="922" y1="452" x2="922" y2="814" stroke="#D7DDD8" stroke-width="1"/><g id="Reporter-and-history"><text x="955" y="469" font-size="20" font-weight="700" fill="#1E2925" >Người báo</text><line x1="955" y1="490" x2="1380" y2="490" stroke="#D7DDD8" stroke-width="1"/><text x="955" y="527" font-size="13" font-weight="400" fill="#66716B" >Họ tên</text><text x="955" y="553" font-size="15" font-weight="700" fill="#1E2925" >Nguyễn Minh Anh</text><text x="1173" y="527" font-size="13" font-weight="400" fill="#66716B" >Căn hộ đã xác minh</text><text x="1173" y="553" font-size="15" font-weight="700" fill="#1E2925" >03</text><line x1="955" y1="576" x2="1380" y2="576" stroke="#D7DDD8" stroke-width="1"/><text x="955" y="613" font-size="20" font-weight="700" fill="#1E2925" >Lịch sử</text><circle cx="961" cy="645" r="4" fill="#1B695B"/><text x="981" y="650" font-size="14" font-weight="700" fill="#1E2925" >09:42 · Cư dân gửi báo cáo</text><text x="981" y="677" font-size="13" font-weight="400" fill="#66716B" >Hệ thống đã ghi nhận; chưa có quyết định tiếp nhận.</text><line x1="955" y1="701" x2="1380" y2="701" stroke="#D7DDD8" stroke-width="1"/><text x="955" y="742" font-size="13" font-weight="400" fill="#66716B" >Sau khi quyết định, lịch sử sẽ ghi người thực hiện và thời điểm.</text></g><text x="60" y="849" font-size="13" font-weight="400" fill="#66716B" >Phiếu khu vực chung  ·  Thông tin người báo chỉ hiển thị cho người có quyền</text></g></svg>
