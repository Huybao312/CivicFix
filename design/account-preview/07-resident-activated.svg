<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><title>CivicFix · 07-resident-activated.svg</title><rect x="0" y="0" width="390" height="844" rx="0" fill="#F3F6F3" stroke="none" stroke-width="1"/><rect x="0" y="0" width="390" height="844" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="20" y="45" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="20" font-weight="700" fill="#176351" text-anchor="start">CivicFix</text><text x="370" y="44" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="12" font-weight="500" fill="#5C6963" text-anchor="end">Tài khoản</text><line x1="0" y1="65" x2="390" y2="65" stroke="#DCE3DC" stroke-width="1"/><rect x="20" y="125" width="46" height="46" rx="23" fill="#EAF3EE" stroke="none" stroke-width="1"/><text x="34" y="158" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="24" font-weight="700" fill="#176351" text-anchor="start">✓</text><text x="20" y="229" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="23" font-weight="600" fill="#1D2A25" text-anchor="start">Tài khoản đã kích hoạt</text><text x="20" y="264" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C6963" text-anchor="start">Bạn có thể xem phiếu của mình và báo sự cố</text><text x="20" y="285" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C6963" text-anchor="start">khu vực chung.</text><rect x="20" y="340" width="350" height="145" rx="8" fill="#F8FAF8" stroke="#DCE3DC" stroke-width="1"/><text x="35" y="370" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="12" font-weight="500" fill="#5C6963" text-anchor="start">Căn hộ của bạn</text><text x="35" y="399" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="17" font-weight="600" fill="#1D2A25" text-anchor="start">Căn 05-08</text><text x="35" y="444" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6963" text-anchor="start">Thông tin do quản trị viên xác minh.</text><rect x="20" y="550" width="350" height="44" rx="7" fill="#1D2A25" stroke="none" stroke-width="1"/><text x="36" y="577" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start">Đăng nhập</text><text x="20" y="625" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6963" text-anchor="start">Nếu căn hộ hiển thị không đúng, hãy báo ngay</text><text x="20" y="646" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="12" font-weight="400" fill="#5C6963" text-anchor="start">cho quản trị viên trước khi gửi phiếu.</text></svg>
