rif" font-size="14" font-weight="400" fill="#5C6963" text-anchor="start">Lời mời chỉ cấp quyền khi người nhận tự kích hoạt.</text><rect x="269" y="204" width="1118" height="338" rx="9" fill="#F8FAF8" stroke="#DCE3DC" stroke-width="1"/><text x="293" y="241" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="21" font-weight="600" fill="#1D2A25" text-anchor="start">Trần Gia Huy</text><text x="293" y="275" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="14" font-weight="400" fill="#5C6963" text-anchor="start">gia.huy@demo.civicfix.local</text><text x="293" y="331" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="12" font-weight="500" fill="#5C6963" text-anchor="start">Căn hộ</text><text x="293" y="356" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="15" font-weight="500" fill="#1D2A25" text-anchor="start">Căn 05-08 · Đã được quản trị viên đối chiếu</text><text x="842" y="331" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="12" font-weight="500" fill="#5C6963" text-anchor="start">Trạng thái</text><text x="842" y="356" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="15" font-weight="600" fill="#815A16" text-anchor="start">Chờ kích hoạt</text><line x1="293" y1="390" x2="1362" y2="390" stroke="#DCE3DC" stroke-width="1"/><text x="293" y="424" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C6963" text-anchor="start">Gửi lúc 27/10/2026 · 10:30</text><text x="293" y="453" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="13" font-weight="400" fill="#5C6963" text-anchor="start">Hết hạn sau 24 giờ. Gửi lại sẽ hủy link cũ.</text><text x="269" y="611" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="19" font-weight="600" fill="#1D2A25" text-anchor="start">Nếu phát hiện mời sai</text><text x="269" y="650" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="14" font-weight="400" fill="#5C6963" text-anchor="start">Thu hồi ngay. Nếu tài khoản đã kích hoạt, k